[project]
name = "casf-benchmark"
version = "0.1.1"
description = "CASF–ChEMBL3D conformer generation benchmark and analysis dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.42.0",
]
analysis = [
    "casf-benchmark[dashboard]",
    "posebusters>=0.4.0",
    "matplotlib>=3.8.0",
]
dev = [
    "casf-benchmark[analysis]",
    "pytest>=8.0.0",
]

[project.scripts]
casf-analyze-conformer-sets = "casf_benchmark.cli.analyze_conformer_sets:main"
casf-analyze-casf16-ligands = "casf_benchmark.cli.analyze_casf16_ligands:main"
casf-build-dashboard-db = "casf_benchmark.cli.build_dashboard_db:main"
casf-build-master-csv = "casf_benchmark.cli.build_master_csv:main"
casf-extended-analysis = "casf_benchmark.cli.extended_analysis:main"
casf-generate-conformer-sets = "casf_benchmark.generation.conformer_sets:main"
casf-launch-parallel = "casf_benchmark.cli.launch_parallel:main"
casf-match-casf16-chembl3d = "casf_benchmark.cli.match_casf16_chembl3d:main"
casf-materialize-generation-sets = "casf_benchmark.cli.materialize_generation_sets:main"
casf-plot-conformer-report = "casf_benchmark.cli.plot_conformer_report:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"casf_benchmark" = ["py.typed", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.setuptools]
include-package-data = true
