# Inference output directories per generation run, one entry per run label.
#
# Generator-agnostic by design: `label` is arbitrary text, so adding RDKit, loqi or
# any other method is a new entry here plus its eval outputs -- not a script fork.
# Only Qwen runs are listed so far.
#
# Each `cohorts` key names the directory that inference wrote under the
# generation-results root (see CASF_GENERATION_RESULTS_ROOT in the batch scripts);
# every such directory holds a `generation_results.pickle`. Runs evaluated on only
# some cohorts simply omit the others.
#
# Optional per-entry descriptors -- `generator`, `display_label`, `model_size`,
# `tokenizer`, `recipe`, `step` -- become the leading columns of
# `extended_druglike_summary`. Qwen labels encode all of these already and are
# parsed automatically (casf_benchmark.catalog.describe_run), so the entries below
# set none; a generator whose label carries no such structure should set the ones
# that mean something for it, e.g.
#
#   - label: rdkit_etkdg_druglike
#     generator: RDKit
#     display_label: "RDKit ETKDG"
#     cohorts:
#       druglike: <inference output dirname>
#
# Consumed by scripts/run_casf_batch_all.sh, scripts/run_druglike_eval_batch.sh and
# scripts/build_druglike_covmat.py. List order is the order the batch scripts run in.

runs:
  # No `casf16_ref` cohort: its analysis aborts on one degenerate conformer
  # (5csp_5csp_conf0, "atoms k and l have identical 3D coordinates") and so has no
  # tables, so listing it here only makes run_casf_batch_all.sh fail the item on every
  # rerun. Inference output for ref does exist, at
  # 20260810_013739_qw600_pre_binned_uniform_revisited_finetuned_from_bigdata_step-29600-hf_casf16_ref_chembl
  # -- restore the cohort key alongside the ref_root in casf_generation_families.yaml
  # once the analysis can get past that ligand.
  - label: qwen_0p6b_4e_from_bigdata_step29600
    cohorts:
      casf16_core: 20260809_232145_qw600_pre_binned_uniform_revisited_finetuned_from_bigdata_step-29600-hf_casf16_core_chembl
